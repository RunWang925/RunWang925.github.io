# 自定义（融合碎碎念+个人故事+站点信息）
cause:
  tip: 碎碎念&建站故事
  title: 关于我和这个站
  content:
    <br>Hi！欢迎你来到这个互联网中不起眼的角落～
    <br>
    关于这个页面，前前后后改了好几版，总想着既简洁又能说清自己，偷偷<del>抄</del>参了不少大佬，最后才有了现在这个“凑活版”hhh
    <br>
    我叫Run，一名来自贵州平平无奇的IT打工人，日常工作就是和网络打交道，只求搬砖路上少踩坑、多摸鱼～ 生活里就爱听音乐、疯狂干饭，工作之余最大的乐趣就是捣鼓网站、啃啃电脑相关的新鲜玩意儿。
    <br>
    一开始接触这些，纯粹是想“白嫖”Pages的无服务器服务，搭点有意思的小项目玩玩，不用花钱买服务器还能折腾技术，简直完美～
    <br>
    慢慢就想搭个正经博客——既能记录每次折腾的踩坑过程，也能总结学到的小技巧，算是给自己的折腾之路留个印记。
    <br>
    于是就有了这个小站～ 这里没有高深的技术干货，更多是我的折腾日志、工作碎碎念和生活感悟。如果这些内容能帮到你，或者让你觉得“原来不止我这么折腾”，那我就超满足啦～
    <br>
    <b>关于本站技术栈</b>：
    <br>• 博客驱动：Hexo + 自定义主题
    <br>• 部署方式：源码托管Git + Git自动化部署 + 腾讯云Pages
    <br>• 服务器：待补充
    <br>• 系统&软件：待补充
    <br>• CDN：待补充
    <br>• 域名：待补充
    <br>• 图床：待补充
    <br>
    （后续会慢慢完善配置，毕竟折腾的路上永无止境hhh）

